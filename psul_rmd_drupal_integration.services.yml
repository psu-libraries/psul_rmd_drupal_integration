parameters:
  psul_rmd_drupal_integration.skip_procedural_hook_scan: true

services:
  cache.rmd_data:
    class: Drupal\Core\Cache\CacheBackendInterface
    tags:
      - { name: cache.bin, default_backend: cache.backend.permanent_database }
    factory: cache_factory:get
    arguments: [rmd_data]
  psul_rmd_drupal_integration.fetcher:
    class: Drupal\psul_rmd_drupal_integration\RmdDataFetcher
    arguments: ['@cache.rmd_data', '@http_client', '@config.factory']
  Drupal\psul_rmd_drupal_integration\RmdDataFetcherInterface: '@psul_rmd_drupal_integration.fetcher'
  Drupal\psul_rmd_drupal_integration\Hook\RmdTokensHooks:
    class: \Drupal\psul_rmd_drupal_integration\Hook\RmdTokensHooks
    autowire: true

  Drupal\psul_rmd_drupal_integration\Hook\PsulRmdDrupalIntegrationHooks:
    class: Drupal\psul_rmd_drupal_integration\Hook\PsulRmdDrupalIntegrationHooks
    autowire: true
